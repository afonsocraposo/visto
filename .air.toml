root = "."
tmp_dir = "tmp"

[build]
cmd = "GOCACHE=/private/tmp/visto-go-cache go build -ldflags='-linkmode=external' -o ./tmp/visto ./cmd/server"
bin = "tmp/visto"
full_bin = "./tmp/visto"
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "data", "frontend"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"
