openapi: 3.1.0
info:
  title: Visto API
  version: 0.1.0
  description: Self-hosted movie and TV tracking API.
servers:
  - url: /api/v1
paths:
  /auth/bootstrap:
    post:
      summary: Create the first local administrator
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapRequest' } } } }
      responses:
        '201': { description: Administrator created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: An administrator already exists }
  /auth/status:
    get:
      summary: Check whether this instance needs its first administrator
      responses:
        '200': { description: Instance account state, content: { application/json: { schema: { type: object, required: [bootstrap_available, signup_enabled], properties: { bootstrap_available: { type: boolean }, signup_enabled: { type: boolean } } } } } }
  /auth/signup:
    post:
      summary: Create a regular user account when public signup is enabled
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupRequest' } } } }
      responses:
        '201': { description: Account created and authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Public signup is disabled }
        '409': { description: Initial administrator setup is incomplete }
  /auth/login:
    post:
      summary: Start a web session
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Authenticated user and session cookie, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Invalid credentials }
        '429': { description: Too many login attempts; retry after the supplied Retry-After interval }
  /auth/logout:
    post:
      summary: Revoke the current web session and clear the cookie; safe to call when already signed out
      responses:
        '204': { description: Session ended and cookie cleared }
        '500': { description: Session could not be revoked }
  /users:
    get:
      summary: List instance users as an administrator
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Instance users, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator access required }
    post:
      summary: Create a local user account as an administrator
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapRequest' } } } }
      responses:
        '201': { description: Local account created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator access required }
  /users/{userID}:
    patch:
      summary: Change an instance user's name or password as an administrator
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [display_name], properties: { display_name: { type: string }, password: { type: string, description: 'Optional replacement password; leave empty to keep the current password.' } } } } } }
      responses:
        '204': { description: User updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator access required }
        '404': { description: User not found }
    delete:
      summary: Delete an instance user as an administrator
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: User and personal data deleted }
        '400': { description: An administrator cannot delete their own account }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator access required }
        '404': { description: User not found }
        '409': { description: Cannot delete the last administrator }
  /me:
    get:
      summary: Get the authenticated user
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tokens:
    get:
      summary: List the authenticated user's personal API tokens without exposing their secrets
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Personal tokens, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PersonalAPIToken' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a personal API token; its secret is returned only in this response
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePersonalAPITokenRequest' } } } }
      responses:
        '201': { description: Created token and one-time secret, content: { application/json: { schema: { $ref: '#/components/schemas/IssuedPersonalAPIToken' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tokens/{tokenID}:
    delete:
      summary: Revoke one of the authenticated user's personal API tokens
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tokenID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Token not found for this user }
  /connected-apps:
    get:
      summary: List OAuth apps connected to the authenticated user's Visto account
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Connected OAuth apps, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConnectedApp' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: OAuth is not configured }
    delete:
      summary: Revoke every OAuth app connected to the authenticated user's account
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: All OAuth grants revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: OAuth is not configured }
  /connected-apps/{clientID}:
    delete:
      summary: Revoke one OAuth app connected to the authenticated user's account
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: clientID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OAuth grant revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: OAuth is not configured }
  /profile/activity-settings:
    get:
      summary: Get the authenticated user's activity-feed visibility
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Activity settings, content: { application/json: { schema: { $ref: '#/components/schemas/ActivitySettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Change the authenticated user's activity-feed visibility
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivitySettings' } } } }
      responses:
        '204': { description: Activity setting updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/pushover-settings:
    patch:
      summary: Save the authenticated user's Pushover app token, user key, and notification preference
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PushoverSettingsRequest' } } } }
      responses:
        '204': { description: Pushover settings updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Secure storage for per-user Pushover credentials is not configured on this instance }
  /profile/pushover-credentials:
    delete:
      summary: Remove the authenticated user's encrypted Pushover credentials and disable notifications
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Pushover credentials removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Secure storage for per-user Pushover credentials is not configured on this instance }
  /feed:
    get:
      summary: List recent opted-in activity on this instance
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Activity page, content: { application/json: { schema: { $ref: '#/components/schemas/FeedPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /export/json:
    get:
      summary: Download the authenticated user's library and plays as JSON
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: JSON export }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /export/csv:
    get:
      summary: Download the authenticated user's library and plays as CSV
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: CSV export }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /search:
    get:
      summary: Search movies and TV shows through the instance TMDB provider
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: language, in: query, schema: { type: string, example: en-US } }
      responses:
        '200': { description: Search results, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MediaSearchResult' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB is not configured }
  /trending:
    get:
      summary: Get cached trending movies and TV shows from the instance TMDB provider
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [day, week], default: week } }
      responses:
        '200': { description: Trending media, content: { application/json: { schema: { $ref: '#/components/schemas/TrendingResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB is not configured }
  /public/trending:
    get:
      summary: Get cached trending movies and TV shows for the sign-in page
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [day, week], default: week } }
      responses:
        '200': { description: Trending media, content: { application/json: { schema: { $ref: '#/components/schemas/TrendingResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB is not configured }
  /discover/movies/{tmdbID}:
    get:
      summary: Get temporary rich movie metadata without adding it to the library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Temporary movie details, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryMovieDetails' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
  /discover/{mediaType}/{tmdbID}/related:
    get:
      summary: Get cached TMDB recommendations for a movie or TV show
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaType, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Up to 12 related titles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MediaSearchResult' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB recommendations are not configured }
  /people/{tmdbID}:
    get:
      summary: Get a person's biography and combined movie and TV cast credits
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Person details and cast credits sorted by popularity
          content:
            application/json:
              schema:
                type: object
                required: [tmdb_id, name, biography, credits]
                properties:
                  tmdb_id: { type: integer, format: int64 }
                  name: { type: string }
                  biography: { type: string }
                  profile_path: { type: string }
                  birthday: { type: string }
                  deathday: { type: string }
                  place_of_birth: { type: string }
                  known_for_department: { type: string }
                  credits: { type: array, items: { $ref: '#/components/schemas/PersonCredit' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB person metadata is not configured }
  /discover/shows/{tmdbID}:
    get:
      summary: Get temporary rich TV metadata and season summaries without adding it to the library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Temporary TV details, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryShowDetails' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
  /discover/shows/{tmdbID}/seasons/{seasonNumber}:
    get:
      summary: Load one temporary TV season's episodes
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: seasonNumber, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Temporary season episodes, content: { application/json: { schema: { $ref: '#/components/schemas/TemporarySeasonDetails' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
  /discover/shows/{tmdbID}/seasons/{seasonNumber}/episodes/{episodeNumber}:
    get:
      summary: Load temporary rich TV episode metadata
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: seasonNumber, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: episodeNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Temporary episode details, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryEpisodeDetails' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
  /movies/{tmdbID}:
    get:
      summary: Get a movie in the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Movie and the user's library state, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryEntry' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Movie is not in the authenticated user's library }
  /shows/{tmdbID}:
    get:
      summary: Get a TV show in the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: TV show and the user's library state, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryEntry' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: TV show is not in the authenticated user's library }
  /library:
    get:
      summary: List the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Library entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LibraryEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Add a movie or TV show to the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveLibraryRequest' } } } }
      responses:
        '201': { description: Saved library item, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /library/{mediaID}:
    patch:
      summary: Change the authenticated user's status and rating for a library item
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaID, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLibraryRequest' } } } }
      responses:
        '200': { description: Updated library item, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /library/{mediaID}/notifications:
    patch:
      summary: Enable or disable new-episode notifications for a tracked TV show
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaID, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses:
        '204': { description: Show notification preference updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Show not found in this user's library }
  /plays:
    post:
      summary: Record one movie or episode watch
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePlayRequest' } } } }
      responses:
        '201': { description: Created play, content: { application/json: { schema: { $ref: '#/components/schemas/Play' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: List the authenticated user's recent play history
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: Recent plays, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /episodes/{episodeID}/rating:
    get:
      summary: Get the authenticated user's episode rating
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: episodeID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Episode rating, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodeRating' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Set or clear the authenticated user's episode rating
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: episodeID, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetEpisodeRatingRequest' } } } }
      responses:
        '200': { description: Updated episode rating, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodeRating' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plays/{playID}:
    parameters:
      - { name: playID, in: path, required: true, schema: { type: string } }
    patch:
      summary: Correct the timestamp of one of the user's plays
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectPlayRequest' } } } }
      responses:
        '204': { description: Play corrected }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Play not found }
    delete:
      summary: Delete one of the user's plays
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Play deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Play not found }
  /plays/bulk:
    post:
      summary: Mark earlier episodes from one show watched as one bulk action
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [episode_ids], properties: { episode_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }, watched_at: { type: string, format: date-time } } } } } }
      responses:
        '201': { description: Created plays for all episodes }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Mark selected episodes unwatched by removing the user's plays for them
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [episode_ids], properties: { episode_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } } } } } } }
      responses:
        '204': { description: All plays for the selected episodes were removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plays/media/{mediaID}:
    delete:
      summary: Mark a movie unwatched by removing all of the user's movie plays
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: All plays for the movie were removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shows/{showID}/episodes:
    get:
      summary: List episodes of a show in the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: showID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Episodes with the user's watched state, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShowEpisode' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Show is not in the authenticated user's library }
  /shows/{showID}/seasons:
    get:
      summary: List seasons for a show in the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: showID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Season summaries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Season' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Show is not in the authenticated user's library }
  /shows/{showID}/progress:
    get:
      summary: Derive the authenticated user's show progress
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: showID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Derived progress, content: { application/json: { schema: { $ref: '#/components/schemas/ShowProgress' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Show is not in the authenticated user's library }
  /seasons/{seasonID}/episodes:
    get:
      summary: List episodes in a season in the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: seasonID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Episodes with the user's watched state, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShowEpisode' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Season is not in the authenticated user's library }
  /continue-watching:
    get:
      summary: Derive the authenticated user's next released episodes
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Continue or start watching entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ContinueEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /calendar:
    get:
      summary: List unwatched upcoming episodes for shows being watched
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Calendar episode entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CalendarEntry' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: visto_session }
    bearerToken: { type: http, scheme: bearer, bearerFormat: Visto personal API token }
  responses:
    BadRequest: { description: Invalid request }
    Unauthorized: { description: Authentication required }
  schemas:
    BootstrapRequest:
      type: object
      required: [username, display_name, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12 }
    SignupRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, format: password, minLength: 12 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    CreatePersonalAPITokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expires_at: { type: string, format: date-time, description: Optional expiry timestamp. Omit for a token that remains active until revoked. }
    PersonalAPIToken:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    IssuedPersonalAPIToken:
      allOf:
        - { $ref: '#/components/schemas/PersonalAPIToken' }
        - type: object
          required: [token]
          properties:
            token: { type: string, description: One-time secret. Store securely; subsequent responses never include it. }
    ConnectedApp:
      type: object
      required: [client_id, client_name, scopes, expires_at]
      properties:
        client_id: { type: string }
        client_name: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, write, offline_access] } }
        connected_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, username, display_name, role, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [admin, user] }
        created_at: { type: string, format: date-time }
    ActivitySettings:
      type: object
      required: [activity_visibility, timezone, pushover_enabled, has_pushover_app_token, has_pushover_user_key, pushover_available]
      properties:
        activity_visibility: { type: string, enum: [private, instance] }
        timezone: { type: string, example: Europe/Lisbon }
        pushover_enabled: { type: boolean }
        has_pushover_app_token: { type: boolean, description: Indicates that an encrypted per-user application token exists. The token is never returned. }
        has_pushover_user_key: { type: boolean, description: Indicates that an encrypted per-user user key exists. The key is never returned. }
        pushover_available: { type: boolean, description: Indicates that the instance can encrypt and store per-user Pushover credentials. }
    PushoverSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        app_token: { type: string, description: Optional replacement application token. It is encrypted and never returned. }
        user_key: { type: string, description: Optional replacement user key. It is encrypted and never returned. }
    FeedItem:
      type: object
      required: [id, display_name, kind, title, occurred_at]
      properties:
        id: { type: string }
        display_name: { type: string }
        kind: { type: string, enum: [watch, rewatch, rating, bulk_watch] }
        title: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        count: { type: integer }
        season_number: { type: integer }
        episode_number: { type: integer }
        occurred_at: { type: string, format: date-time }
    FeedPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FeedItem' } }
        next_cursor: { type: [string, 'null'] }
    MediaSearchResult:
      type: object
      required: [tmdb_id, type, title, original_title, overview, release_date, poster_path, original_language]
      properties:
        tmdb_id: { type: integer, format: int64 }
        type: { type: string, enum: [movie, tv] }
        title: { type: string }
        original_title: { type: string }
        overview: { type: string }
        release_date: { type: string, format: date }
        poster_path: { type: string }
        original_language: { type: string }
        backdrop_path: { type: string }
    TrendingResponse:
      type: object
      required: [tv, movies]
      properties:
        tv: { type: array, items: { $ref: '#/components/schemas/MediaSearchResult' } }
        movies: { type: array, items: { $ref: '#/components/schemas/MediaSearchResult' } }
    CastMember:
      type: object
      required: [id, name, character]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        character: { type: string }
        profile_path: { type: string }
    CrewMember:
      type: object
      required: [id, name, job, department]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        job: { type: string }
        department: { type: string }
        profile_path: { type: string }
    PersonCredit:
      type: object
      required: [tmdb_id, type, title, popularity]
      properties:
        tmdb_id: { type: integer, format: int64 }
        type: { type: string, enum: [movie, tv] }
        title: { type: string }
        original_title: { type: string }
        character: { type: string }
        overview: { type: string }
        release_date: { type: string }
        poster_path: { type: string }
        backdrop_path: { type: string }
        original_language: { type: string }
        popularity: { type: number, format: float }
    TemporaryMovieDetails:
      type: object
      required: [media, cast, genres]
      properties:
        media: { $ref: '#/components/schemas/MediaSnapshot' }
        runtime: { type: integer, minimum: 0 }
        vote_average: { type: number, minimum: 0, maximum: 10 }
        genres: { type: array, items: { type: string } }
        cast: { type: array, items: { $ref: '#/components/schemas/CastMember' } }
    TemporaryShowDetails:
      type: object
      required: [media, seasons, cast]
      properties:
        media: { $ref: '#/components/schemas/MediaSnapshot' }
        seasons: { type: array, items: { $ref: '#/components/schemas/TemporarySeasonDetails' } }
        cast: { type: array, items: { $ref: '#/components/schemas/CastMember' } }
    TemporarySeasonDetails:
      type: object
      required: [tmdb_id, season_number, name]
      properties:
        tmdb_id: { type: integer, format: int64 }
        season_number: { type: integer, minimum: 0 }
        name: { type: string }
        overview: { type: string }
        poster_path: { type: string }
        air_date: { type: string, format: date }
        episodes: { type: array, items: { $ref: '#/components/schemas/ShowEpisode' } }
    TemporaryEpisodeDetails:
      type: object
      required: [name]
      properties:
        name: { type: string }
        overview: { type: string }
        air_date: { type: string, format: date }
        runtime: { type: integer, minimum: 0 }
        still_path: { type: string }
        vote_average: { type: number, minimum: 0, maximum: 10 }
        production_code: { type: string }
        guest_stars: { type: array, items: { $ref: '#/components/schemas/CastMember' } }
        crew: { type: array, items: { $ref: '#/components/schemas/CrewMember' } }
    SaveLibraryRequest:
      type: object
      required: [media, status]
      properties:
        media: { $ref: '#/components/schemas/MediaSearchResult' }
        status: { type: string, enum: [watchlist, watching, paused, dropped] }
        rating: { type: integer, minimum: 1, maximum: 5 }
    UpdateLibraryRequest:
      type: object
      required: [status, rating]
      properties:
        status: { type: string, enum: [watchlist, watching, paused, dropped] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
    EpisodeRating:
      type: object
      required: [episode_id, rating]
      properties:
        episode_id: { type: string }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        updated_at: { type: string, format: date-time }
    SetEpisodeRatingRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
    LibraryItem:
      type: object
      required: [user_id, media_id, status, notifications_enabled, added_at, updated_at]
      properties:
        user_id: { type: string }
        media_id: { type: string }
        status: { type: string, enum: [watchlist, watching, paused, dropped] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        notifications_enabled: { type: boolean, description: Per-show new-episode notification preference. }
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LibraryEntry:
      type: object
      required: [item, media, completed]
      properties:
        item: { $ref: '#/components/schemas/LibraryItem' }
        media: { $ref: '#/components/schemas/MediaSearchResult' }
        completed: { type: boolean, description: Derived movie display state; true when this user has at least one movie play. Never stored as a library status. }
        progress: { $ref: '#/components/schemas/ShowLibraryProgress' }
    ShowLibraryProgress:
      type: object
      description: Per-user TV progress across regular episodes only; omitted for movies and shows without imported episode metadata.
      required: [watched_episodes, total_episodes]
      properties:
        watched_episodes: { type: integer, minimum: 0 }
        total_episodes: { type: integer, minimum: 1 }
    CreatePlayRequest:
      type: object
      properties:
        media_id: { type: string }
        episode_id: { type: string }
        watched_at: { type: string, format: date-time, description: Must not be in the future. Defaults to now. }
        source: { type: string, enum: [web, api, mcp, import], default: web }
      oneOf:
        - required: [media_id]
        - required: [episode_id]
    CorrectPlayRequest:
      type: object
      required: [watched_at]
      properties:
        watched_at: { type: string, format: date-time, description: Must not be in the future. }
    Play:
      type: object
      required: [id, user_id, watched_at, source]
      properties:
        id: { type: string }
        user_id: { type: string }
        media_id: { type: [string, 'null'] }
        episode_id: { type: [string, 'null'] }
        watched_at: { type: string, format: date-time }
        source: { type: string, enum: [web, api, mcp, import] }
    HistoryEntry:
      type: object
      required: [play, title]
      properties:
        play: { $ref: '#/components/schemas/Play' }
        title: { type: string }
        episode_label: { type: string }
    Episode:
      type: object
      required: [id, show_id, season_number, episode_number, air_date]
      properties:
        id: { type: string }
        show_id: { type: string }
        season_number: { type: integer, minimum: 0 }
        episode_number: { type: integer, minimum: 0 }
        air_date: { type: [string, 'null'], format: date }
    Season:
      type: object
      required: [id, show_id, season_number, name, episode_count]
      properties:
        id: { type: string }
        show_id: { type: string }
        season_number: { type: integer, minimum: 0 }
        name: { type: string }
        episode_count: { type: integer, minimum: 0 }
        air_date: { type: string, format: date }
    ShowEpisode:
      type: object
      required: [episode, name, watched]
      properties:
        episode: { $ref: '#/components/schemas/Episode' }
        name: { type: string }
        overview: { type: string }
        runtime: { type: integer, minimum: 0 }
        still_path: { type: string }
        watched: { type: boolean }
    MediaSnapshot:
      type: object
      required: [id, title, original_title, overview, release_date, poster_path, original_language, type, tmdb_id]
      properties:
        id: { type: string }
        title: { type: string }
        original_title: { type: string }
        overview: { type: string }
        release_date: { type: string }
        poster_path: { type: string }
        backdrop_path: { type: string }
        original_language: { type: string }
        status: { type: string }
        type: { type: string, enum: [movie, tv] }
        tmdb_id: { type: integer, format: int64 }
    ShowProgress:
      type: object
      required: [show_id, cursor, next_episode, latest_released_episode, is_caught_up]
      properties:
        show_id: { type: string }
        cursor: { anyOf: [{ $ref: '#/components/schemas/Episode' }, { type: 'null' }] }
        next_episode: { anyOf: [{ $ref: '#/components/schemas/Episode' }, { type: 'null' }] }
        latest_released_episode: { anyOf: [{ $ref: '#/components/schemas/Episode' }, { type: 'null' }] }
        is_caught_up: { type: boolean }
    ContinueEntry:
      type: object
      required: [show_id, title, kind, next_episode]
      properties:
        show_id: { type: string }
        title: { type: string }
        poster_path: { type: string }
        kind: { type: string, enum: [continue, start] }
        cursor: { anyOf: [{ $ref: '#/components/schemas/Episode' }, { type: 'null' }] }
        next_episode: { $ref: '#/components/schemas/Episode' }
        missing_prior_episodes: { type: array, items: { $ref: '#/components/schemas/Episode' } }
    CalendarEntry:
      type: object
      required: [show_id, title, episode]
      properties:
        show_id: { type: string }
        title: { type: string }
        episode: { $ref: '#/components/schemas/Episode' }
