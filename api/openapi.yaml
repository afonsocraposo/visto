openapi: 3.1.0
info:
  title: Visto API
  version: 0.1.0
  description: Self-hosted movie and TV tracking API.
servers:
  - url: /api/v1
paths:
  /auth/bootstrap:
    post:
      summary: Create the first local administrator
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapRequest' } } } }
      responses:
        '201': { description: Administrator created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: An administrator already exists }
  /auth/login:
    post:
      summary: Start a web session
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Authenticated user and session cookie, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Invalid credentials }
  /users:
    post:
      summary: Create a local user account as an administrator
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapRequest' } } } }
      responses:
        '201': { description: Local account created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator access required }
  /me:
    get:
      summary: Get the authenticated user
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/activity-settings:
    get:
      summary: Get the authenticated user's activity-feed visibility
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Activity settings, content: { application/json: { schema: { $ref: '#/components/schemas/ActivitySettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Change the authenticated user's activity-feed visibility
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivitySettings' } } } }
      responses:
        '204': { description: Activity setting updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /feed:
    get:
      summary: List recent opted-in activity on this instance
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Activity page, content: { application/json: { schema: { $ref: '#/components/schemas/FeedPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /export/json:
    get:
      summary: Download the authenticated user's library and plays as JSON
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: JSON export }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /export/csv:
    get:
      summary: Download the authenticated user's library and plays as CSV
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: CSV export }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /search:
    get:
      summary: Search movies and TV shows through the instance TMDB provider
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: language, in: query, schema: { type: string, example: en-US } }
      responses:
        '200': { description: Search results, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MediaSearchResult' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB is not configured }
  /library:
    get:
      summary: List the authenticated user's library
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Library entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LibraryEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plays:
    post:
      summary: Record one movie or episode watch
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePlayRequest' } } } }
      responses:
        '201': { description: Created play, content: { application/json: { schema: { $ref: '#/components/schemas/Play' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plays/{playID}:
    parameters:
      - { name: playID, in: path, required: true, schema: { type: string } }
    patch:
      summary: Correct the timestamp of one of the user's plays
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectPlayRequest' } } } }
      responses:
        '204': { description: Play corrected }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Play not found }
    delete:
      summary: Delete one of the user's plays
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Play deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Play not found }
    post:
      summary: Add a movie or TV show to the authenticated user's library
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveLibraryRequest' } } } }
      responses:
        '201': { description: Saved library item, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: visto_session }
  responses:
    BadRequest: { description: Invalid request }
    Unauthorized: { description: Authentication required }
  schemas:
    BootstrapRequest:
      type: object
      required: [username, display_name, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    User:
      type: object
      required: [id, username, display_name, role, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [admin, user] }
        created_at: { type: string, format: date-time }
    ActivitySettings:
      type: object
      required: [activity_visibility]
      properties:
        activity_visibility: { type: string, enum: [private, instance] }
    FeedItem:
      type: object
      required: [id, display_name, kind, title, occurred_at]
      properties:
        id: { type: string }
        display_name: { type: string }
        kind: { type: string, enum: [watch, rewatch, rating, bulk_watch] }
        title: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        season_number: { type: integer }
        episode_number: { type: integer }
        occurred_at: { type: string, format: date-time }
    FeedPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FeedItem' } }
        next_cursor: { type: [string, 'null'] }
    MediaSearchResult:
      type: object
      required: [tmdb_id, type, title]
      properties:
        tmdb_id: { type: integer, format: int64 }
        type: { type: string, enum: [movie, tv] }
        title: { type: string }
        original_title: { type: string }
        overview: { type: string }
        release_date: { type: string, format: date }
        poster_path: { type: string }
        original_language: { type: string }
    SaveLibraryRequest:
      type: object
      required: [media, status]
      properties:
        media: { $ref: '#/components/schemas/MediaSearchResult' }
        status: { type: string, enum: [watchlist, watching, paused, dropped] }
        rating: { type: integer, minimum: 1, maximum: 5 }
    LibraryItem:
      type: object
      required: [user_id, media_id, status, added_at, updated_at]
      properties:
        user_id: { type: string }
        media_id: { type: string }
        status: { type: string, enum: [watchlist, watching, paused, dropped] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LibraryEntry:
      type: object
      required: [item, media]
      properties:
        item: { $ref: '#/components/schemas/LibraryItem' }
        media: { $ref: '#/components/schemas/MediaSearchResult' }
    CreatePlayRequest:
      type: object
      properties:
        media_id: { type: string }
        episode_id: { type: string }
        watched_at: { type: string, format: date-time, description: Must not be in the future. Defaults to now. }
        source: { type: string, enum: [web, api, mcp, import], default: web }
      oneOf:
        - required: [media_id]
        - required: [episode_id]
    CorrectPlayRequest:
      type: object
      required: [watched_at]
      properties:
        watched_at: { type: string, format: date-time, description: Must not be in the future. }
    Play:
      type: object
      required: [id, user_id, watched_at, source]
      properties:
        id: { type: string }
        user_id: { type: string }
        media_id: { type: [string, 'null'] }
        episode_id: { type: [string, 'null'] }
        watched_at: { type: string, format: date-time }
        source: { type: string, enum: [web, api, mcp, import] }
