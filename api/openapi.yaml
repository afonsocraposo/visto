openapi: 3.1.0
info:
  title: Visto API
  version: 0.1.0
  description: Self-hosted movie and TV tracking API.
servers:
  - url: /api/v1
paths:
  /imports/welcome:
    get:
      summary: Check whether the current account should see the import welcome prompt
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Import welcome state, content: { application/json: { schema: { type: object, properties: { pending: { type: boolean } } } } } }
  /imports/welcome/dismiss:
    post:
      summary: Dismiss the import welcome prompt for this account
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Prompt dismissed }
  /imports/bingers:
    post:
      summary: Import a Bingers ZIP archive into the current account
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/zip: { schema: { type: string, format: binary } } } }
      responses:
        '200': { description: Imported counts and skipped records, content: { application/json: { schema: { type: object, properties: { titles: { type: integer }, watches: { type: integer }, ratings: { type: integer }, skipped: { type: integer }, unsupported: { type: integer }, issues: { type: array, items: { type: object, properties: { item: { type: string }, reason: { type: string } } } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { description: Archive is too large }
  /auth/bootstrap:
    post:
      summary: Create the first local administrator
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapRequest' } } } }
      responses:
        '201': { description: Administrator created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: An administrator already exists }
  /auth/status:
    get:
      summary: Check whether this instance needs its first administrator
      responses:
        '200': { description: Instance account state, content: { application/json: { schema: { type: object, required: [bootstrap_available, signup_enabled, google_enabled], properties: { bootstrap_available: { type: boolean }, signup_enabled: { type: boolean }, google_enabled: { type: boolean } } } } } }
  /auth/google:
    get:
      summary: Start optional Google sign-in
      responses:
        '302': { description: 'Redirect to Google when OAuth is configured' }
        '404': { description: Google sign-in is not configured }
  /auth/google/callback:
    get:
      summary: Complete Google sign-in
      responses:
        '302': { description: 'Redirect back to Visto and set a session cookie' }
  /auth/signup:
    post:
      summary: Create a regular user account when public signup is enabled
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupRequest' } } } }
      responses:
        '201': { description: Account created and authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Public signup is disabled }
        '409': { description: Initial administrator setup is incomplete }
  /auth/login:
    post:
      summary: Start a web session
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Authenticated user and session cookie, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Invalid credentials }
        '429': { description: Too many login attempts; retry after the supplied Retry-After interval }
  /auth/logout:
    post:
      summary: Revoke the current web session and clear the cookie; safe to call when already signed out
      responses:
        '204': { description: Session ended and cookie cleared }
        '500': { description: Session could not be revoked }
  /users:
    get:
      summary: List instance users as an administrator
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Instance users page, content: { application/json: { schema: { $ref: '#/components/schemas/UsersPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator access required }
    post:
      summary: Create a local user account as an administrator
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapRequest' } } } }
      responses:
        '201': { description: Local account created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator access required }
  /users/{userID}:
    patch:
      summary: Change an instance user's name or password as an administrator
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, password: { type: string, description: 'Optional replacement password; leave empty to keep the current password.' } } } } } }
      responses:
        '204': { description: User updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator access required }
        '404': { description: User not found }
    delete:
      summary: Delete an instance user as an administrator
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: User and personal data deleted }
        '400': { description: An administrator cannot delete their own account }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Administrator access required }
        '404': { description: User not found }
        '409': { description: Cannot delete the last administrator }
  /me:
    get:
      summary: Get the authenticated user
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tokens:
    get:
      summary: List the authenticated user's personal API tokens without exposing their secrets
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Personal tokens, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PersonalAPIToken' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a personal API token; its secret is returned only in this response
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePersonalAPITokenRequest' } } } }
      responses:
        '201': { description: Created token and one-time secret, content: { application/json: { schema: { $ref: '#/components/schemas/IssuedPersonalAPIToken' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tokens/{tokenID}:
    delete:
      summary: Revoke one of the authenticated user's personal API tokens
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tokenID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Token not found for this user }
  /connected-apps:
    get:
      summary: List OAuth apps connected to the authenticated user's Visto account
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Connected OAuth apps, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConnectedApp' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: OAuth is not configured }
    delete:
      summary: Revoke every OAuth app connected to the authenticated user's account
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: All OAuth grants revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: OAuth is not configured }
  /connected-apps/{clientID}:
    delete:
      summary: Revoke one OAuth app connected to the authenticated user's account
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: clientID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OAuth grant revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: OAuth is not configured }
  /profile/activity-settings:
    get:
      summary: Get the authenticated user's activity-feed visibility
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Activity settings, content: { application/json: { schema: { $ref: '#/components/schemas/ActivitySettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Change the authenticated user's activity-feed visibility
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivitySettings' } } } }
      responses:
        '204': { description: Activity setting updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/pushover-settings:
    patch:
      summary: Save the authenticated user's Pushover app token, user key, and notification preference
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PushoverSettingsRequest' } } } }
      responses:
        '204': { description: Pushover settings updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Secure storage for per-user Pushover credentials is not configured on this instance }
  /profile/pushover-test:
    post:
      summary: Send a test notification using the authenticated user's saved Pushover credentials
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Pushover accepted the test notification }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: Pushover rejected the test notification }
        '503': { description: Pushover is not configured }
  /profile/pushover-credentials:
    delete:
      summary: Remove the authenticated user's encrypted Pushover credentials and disable notifications
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Pushover credentials removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Secure storage for per-user Pushover credentials is not configured on this instance }
  /profile/web-push-key:
    get:
      summary: Get the public VAPID key for this instance
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Public VAPID key }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Web Push is not configured }
  /profile/web-push-subscription:
    post:
      summary: Subscribe this device to episode notifications
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebPushSubscription' } } } }
      responses:
        '204': { description: Device subscribed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Remove this device's push subscription
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [endpoint], properties: { endpoint: { type: string } } } } } }
      responses:
        '204': { description: Device subscription removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/web-push-status:
    post:
      summary: Check whether this device is subscribed for the authenticated user
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [endpoint], properties: { endpoint: { type: string } } } } } }
      responses:
        '200': { description: Device subscription status }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/web-push-test:
    post:
      summary: Send a test notification to this subscribed device
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebPushSubscription' } } } }
      responses:
        '204': { description: Push provider accepted the test }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Device is not subscribed }
        '410': { description: Subscription expired }
  /profile/plex-webhook:
    get:
      summary: Get this user's Plex webhook status and recent sync events
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Plex webhook status, content: { application/json: { schema: { $ref: '#/components/schemas/PlexWebhookStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create or rotate this user's Plex webhook URL; the secret is returned once
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { account_id: { type: string, pattern: '^[0-9]*$', description: Numeric Plex account ID. An empty value skips all events until the webhook is rotated with an ID. } } } } } }
      responses:
        '201': { description: Created webhook URL, content: { application/json: { schema: { type: object, required: [webhook_url], properties: { webhook_url: { type: string, format: uri } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: VISTO_PUBLIC_URL is not configured }
    delete:
      summary: Revoke this user's Plex webhook URL
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Webhook URL revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile/plex-webhook/events/{id}:
    get:
      summary: Get the stored raw Plex payload of one of this user's recent sync events
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Raw payload; empty for events recorded before payloads were stored, content: { application/json: { schema: { type: object, required: [raw_payload], properties: { raw_payload: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Event not found }
  /admin/plex-sync:
    get:
      summary: Get admin Plex mode, shared webhook status, mappings, and recently observed accounts
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Admin Plex sync status, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPlexSyncStatus' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/plex-sync/webhook:
    post:
      summary: Create or rotate the shared Plex webhook URL
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '201': { description: Secret URL returned once, content: { application/json: { schema: { type: object, required: [webhook_url], properties: { webhook_url: { type: string, format: uri } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Revoke the shared Plex webhook URL
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Shared URL revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/plex-sync/users/{userID}:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: string } }
    put:
      summary: Map a numeric Plex account ID to one Visto user
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [account_id], properties: { account_id: { type: string, pattern: '^[0-9]{1,20}$' } } } } } }
      responses:
        '204': { description: Mapping saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Remove a user's Plex account mapping
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Mapping removed }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/plex/{secret}:
    post:
      summary: Receive Plex playback webhooks and synchronize media.scrobble events
      parameters:
        - { name: secret, in: path, required: true, schema: { type: string, minLength: 40, maxLength: 80 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, description: Plex JSON event payload }
      responses:
        '204': { description: Event accepted or safely skipped }
        '400': { description: Invalid webhook form or missing payload }
        '404': { description: Unknown or revoked webhook secret }
        '413': { description: Webhook payload exceeds the 1 MiB limit }
  /feed:
    get:
      summary: List recent opted-in activity on this instance
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Activity page, content: { application/json: { schema: { $ref: '#/components/schemas/FeedPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /community/users:
    get:
      summary: List instance users by display name for authenticated users
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Directory page, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityUsersPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /community/users/{userID}:
    get:
      summary: Get a user's display name and sharing status
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Community profile, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: User not found }
  /community/users/{userID}/library:
    get:
      summary: List a user's library when shared with the instance
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [updated, title, released] } }
        - { name: status, in: query, schema: { type: string, enum: [watching, watchlist, paused, completed, dropped] } }
        - { name: media_type, in: query, schema: { type: string, enum: [movie, tv] } }
        - { name: q, in: query, schema: { type: string }, description: 'Filter shared media by title or original title, case-insensitively.' }
      responses:
        '200': { description: Shared library page, content: { application/json: { schema: { $ref: '#/components/schemas/CommunityLibraryPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Library is private }
        '404': { description: User not found }
  /community/users/{userID}/activity:
    get:
      summary: List a user's recent activity when shared with the instance
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Shared activity page, content: { application/json: { schema: { $ref: '#/components/schemas/FeedPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Activity is private }
        '404': { description: User not found }
  /export/json:
    get:
      summary: Download the authenticated user's library and plays as JSON
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: JSON export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /export/csv:
    get:
      summary: Download the authenticated user's library and plays as CSV
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /search:
    get:
      summary: Search movies and TV shows through the instance TMDB provider
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: language, in: query, schema: { type: string, example: en-US } }
        - { name: type, in: query, description: Restrict results to one media type, schema: { type: string, enum: [all, tv, movie], default: all } }
      responses:
        '200': { description: Search results, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MediaSearchResult' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB is not configured }
  /trending:
    get:
      summary: Get cached trending movies and TV shows from the instance TMDB provider
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [day, week], default: week } }
      responses:
        '200': { description: Trending media, content: { application/json: { schema: { $ref: '#/components/schemas/TrendingResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB is not configured }
  /public/trending:
    get:
      summary: Get cached trending movies and TV shows for the sign-in page
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [day, week], default: week } }
      responses:
        '200': { description: Trending media, content: { application/json: { schema: { $ref: '#/components/schemas/TrendingResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB is not configured }
  /discover/movies/{tmdbID}:
    get:
      summary: Get temporary rich movie metadata without adding it to the library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Temporary movie details, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryMovieDetails' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
  /discover/{mediaType}/{tmdbID}/related:
    get:
      summary: Get cached TMDB recommendations for a movie or TV show
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaType, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Up to 12 related titles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MediaSearchResult' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB recommendations are not configured }
  /people/{tmdbID}:
    get:
      summary: Get a person's biography and combined movie and TV cast credits
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Person details and cast credits sorted by popularity
          content:
            application/json:
              schema:
                type: object
                required: [tmdb_id, name, biography, credits]
                properties:
                  tmdb_id: { type: integer, format: int64 }
                  name: { type: string }
                  biography: { type: string }
                  profile_path: { type: string }
                  birthday: { type: string }
                  deathday: { type: string }
                  place_of_birth: { type: string }
                  known_for_department: { type: string }
                  credits: { type: array, items: { $ref: '#/components/schemas/PersonCredit' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
        '503': { description: TMDB person metadata is not configured }
  /discover/shows/{tmdbID}:
    get:
      summary: Get temporary rich TV metadata and season summaries without adding it to the library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Temporary TV details, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryShowDetails' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
  /discover/shows/{tmdbID}/seasons/{seasonNumber}:
    get:
      summary: Load one temporary TV season's episodes
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: seasonNumber, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Temporary season episodes, content: { application/json: { schema: { $ref: '#/components/schemas/TemporarySeasonDetails' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
  /discover/shows/{tmdbID}/seasons/{seasonNumber}/episodes/{episodeNumber}:
    get:
      summary: Load temporary rich TV episode metadata
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: seasonNumber, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: episodeNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Temporary episode details, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryEpisodeDetails' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: TMDB is temporarily unavailable }
  /movies/{tmdbID}:
    get:
      summary: Get a movie with the authenticated user's library state, if saved
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Movie details with an empty library item when unsaved, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryEntry' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Movie is unavailable from both the library and metadata provider }
  /shows/{tmdbID}:
    get:
      summary: Get a TV show with the authenticated user's library state, if saved
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: TV show details with an empty library item when unsaved, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryEntry' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: TV show is unavailable from both the library and metadata provider }
  /media/{mediaType}/{tmdbID}/refresh:
    post:
      summary: Force-refresh a stored title's metadata from TMDB (administrators only)
      description: Fetches fresh metadata and, for TV shows, the season and episode catalog. Stored metadata is only replaced after TMDB returns a valid response, so a failed refresh leaves the title untouched. Watch history, ratings, and library state are preserved.
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaType, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: tmdbID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '204': { description: Metadata refreshed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: The title is not stored in Visto }
        '502': { description: TMDB refresh failed; stored metadata is unchanged }
  /library:
    get:
      summary: List the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [updated, title, released], default: updated }, description: 'Sort by last update, title, or release date.' }
        - { name: status, in: query, schema: { type: string, enum: [watching, watchlist, paused, dropped, completed] } }
        - { name: media_type, in: query, schema: { type: string, enum: [movie, tv] } }
        - { name: q, in: query, schema: { type: string }, description: 'Filter saved media by title or original title, case-insensitively.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Library page, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Add a movie or TV show to the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveLibraryRequest' } } } }
      responses:
        '201': { description: Saved library item, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /library/lookup:
    post:
      summary: Look up library entries by media ID
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [media_ids], properties: { media_ids: { type: array, maxItems: 100, items: { type: string } } } } } } }
      responses:
        '200': { description: Matching library entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LibraryEntry' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /library/{mediaID}:
    delete:
      summary: Remove a non-completed library entry from its current list (TV watch history is preserved)
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaID, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [watchlist, watching, paused, dropped], default: watchlist } }
      responses:
        '204': { description: Item removed from the selected list }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: "Title is not in the selected list or is completed" }
    patch:
      summary: Change the authenticated user's status and rating for a library item
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaID, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLibraryRequest' } } } }
      responses:
        '200': { description: Updated library item, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /library/{mediaID}/notifications:
    patch:
      summary: Choose episode or full-season alerts for a tracked show, or toggle watchlist movie alerts
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaID, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean, description: Legacy show or watchlist movie alert toggle. }, mode: { type: string, enum: [episode, season], description: Show-wide notification choice. } } } } } }
      responses:
        '204': { description: Media notification preference updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Eligible media not found in this user's library }
  /plays:
    post:
      summary: Record one movie or episode watch
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePlayRequest' } } } }
      responses:
        '201': { description: Created play, content: { application/json: { schema: { $ref: '#/components/schemas/Play' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: List the authenticated user's recent play history
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: media_id, in: query, schema: { type: string, description: Filter watches to one movie ID. } }
        - { name: episode_id, in: query, schema: { type: string, description: Filter watches to one episode ID. } }
        - { name: show_id, in: query, schema: { type: string, description: Filter watches to any episode of one TV show ID. Cannot be combined with media_id or episode_id. } }
      responses:
        '200': { description: Play history page, content: { application/json: { schema: { $ref: '#/components/schemas/PlaysPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /episodes/{episodeID}/rating:
    get:
      summary: Get the authenticated user's episode rating
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: episodeID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Episode rating, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodeRating' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Set or clear the authenticated user's episode rating
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: episodeID, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetEpisodeRatingRequest' } } } }
      responses:
        '200': { description: Updated episode rating, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodeRating' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plays/{playID}:
    parameters:
      - { name: playID, in: path, required: true, schema: { type: string } }
    patch:
      summary: Correct the timestamp of one of the user's plays
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectPlayRequest' } } } }
      responses:
        '204': { description: Play corrected }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Play not found }
    delete:
      summary: Delete one of the user's plays
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Play deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Play not found }
  /plays/bulk:
    post:
      summary: Record plays for selected episodes
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [episode_ids], properties: { episode_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }, watched_at: { type: string, format: date-time } } } } } }
      responses:
        '201':
          description: Created plays for all episodes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Play' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Mark selected episodes unwatched by removing the user's plays for them
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [episode_ids], properties: { episode_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } } } } } } }
      responses:
        '200':
          description: Removed plays, returned so the action can be undone
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Play' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /plays/media/{mediaID}:
    delete:
      summary: Mark a movie unwatched by removing its plays and the user's library entry
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: mediaID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Movie plays and its library entry were removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shows/{showID}/episodes:
    get:
      summary: List episodes of a show in the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: showID, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Episodes page with the user's watched state, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodesPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Show is not in the authenticated user's library }
  /shows/{showID}/episodes/watch-through:
    post:
      summary: Mark missing released episodes through an episode watched
      description: Includes the target episode and earlier regular episodes. Already watched episodes are skipped. The show must be in the user's library.
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: showID, in: path, required: true, schema: { type: string }, example: 'tv:123' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WatchThroughRequest' } } } }
      responses:
        '200': { description: Number of newly watched episodes and updated progress, content: { application/json: { schema: { $ref: '#/components/schemas/WatchThroughResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Show is not in the authenticated user's library }
  /shows/{showID}/seasons:
    get:
      summary: List seasons for a show in the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: showID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Season summaries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Season' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Show is not in the authenticated user's library }
  /shows/{showID}/progress:
    get:
      summary: Derive the authenticated user's show progress
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: showID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Derived progress, content: { application/json: { schema: { $ref: '#/components/schemas/ShowProgress' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Show is not in the authenticated user's library }
  /seasons/{seasonID}/episodes:
    get:
      summary: List episodes in a season in the authenticated user's library
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: seasonID, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Episodes page with the user's watched state, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodesPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Season is not in the authenticated user's library }
  /seasons/{seasonID}/ready-alert:
    get:
      summary: Get season availability and the user's season-ready subscription
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: seasonID, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Season alert state, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonReadyAlert' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Season is not in the authenticated user's library }
    put:
      summary: Subscribe to an alert when all regular episodes in this season are available
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: seasonID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Season alert subscribed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Season is not in the authenticated user's library }
        '409': { description: Show is not Watching or the season is already ready }
    delete:
      summary: Cancel a pending season-ready alert
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: seasonID, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Pending season alert canceled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Season is not in the authenticated user's library }
  /continue-watching:
    get:
      summary: Derive the authenticated user's next released episodes
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      responses:
        '200': { description: Continue or start watching entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ContinueEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /calendar:
    get:
      summary: List unwatched upcoming episodes for shows being watched
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Calendar episode page, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /calendar/dates:
    get:
      summary: List dates with upcoming episodes for calendar markers
      security: [{ sessionCookie: [] }, { bearerToken: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Sorted release dates, content: { application/json: { schema: { type: array, items: { type: string, format: date } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: visto_session }
    bearerToken: { type: http, scheme: bearer, bearerFormat: Visto personal API token }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Administrator access required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    BootstrapRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12 }
    SignupRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password }
    CreatePersonalAPITokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expires_at: { type: string, format: date-time, description: Optional expiry timestamp. Omit for a token that remains active until revoked. }
    PersonalAPIToken:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    IssuedPersonalAPIToken:
      allOf:
        - { $ref: '#/components/schemas/PersonalAPIToken' }
        - type: object
          required: [token]
          properties:
            token: { type: string, description: One-time secret. Store securely; subsequent responses never include it. }
    ConnectedApp:
      type: object
      required: [client_id, client_name, scopes, expires_at]
      properties:
        client_id: { type: string }
        client_name: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, write, offline_access] } }
        connected_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, email, name, role, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        created_at: { type: string, format: date-time }
    ActivitySettings:
      type: object
      required: [activity_visibility, timezone, pushover_enabled, has_pushover_app_token, has_pushover_user_key, pushover_available]
      properties:
        activity_visibility: { type: string, enum: [private, instance] }
        timezone: { type: string, example: Europe/Lisbon }
        pushover_enabled: { type: boolean }
        has_pushover_app_token: { type: boolean, description: Indicates that an encrypted per-user application token exists. The token is never returned. }
        has_pushover_user_key: { type: boolean, description: Indicates that an encrypted per-user user key exists. The key is never returned. }
        pushover_available: { type: boolean, description: Indicates that the instance can encrypt and store per-user Pushover credentials. }
    WebPushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [auth, p256dh]
          properties:
            auth: { type: string }
            p256dh: { type: string }
    PushoverSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        app_token: { type: string, description: Optional replacement application token. It is encrypted and never returned. }
        user_key: { type: string, description: Optional replacement user key. It is encrypted and never returned. }
    PlexWebhookEvent:
      type: object
      required: [id, status, occurred_at]
      properties:
        id: { type: integer, format: int64 }
        tmdb_id: { type: integer, format: int64 }
        event_type: { type: string, description: Plex event name such as media.stop or media.scrobble }
        status: { type: string, enum: [synced, skipped, failed] }
        title: { type: string, description: The show for an episode, or the movie title }
        episode_label: { type: string, description: 'Episode number such as S2E4; absent for movies' }
        media_type: { type: string }
        message: { type: string }
        occurred_at: { type: string, format: date-time }
    PlexWebhookStatus:
      type: object
      required: [enabled, mode, managed_webhook_enabled, recent_events]
      properties:
        mode: { type: string, enum: [personal, managed] }
        managed_account_id: { type: string }
        managed_webhook_enabled: { type: boolean }
        enabled: { type: boolean }
        account_id: { type: string, description: Numeric Plex account ID allowed to sync }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        last_synced_at: { type: string, format: date-time }
        recent_events: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/PlexWebhookEvent' } }
    AdminPlexSyncStatus:
      type: object
      required: [mode, webhook_enabled, mappings, observed_accounts]
      properties:
        mode: { type: string, enum: [personal, managed] }
        webhook_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        mappings:
          type: array
          items: { type: object, required: [user_id, account_id], properties: { user_id: { type: string }, account_id: { type: string } } }
        observed_accounts:
          type: array
          maxItems: 100
          items: { type: object, required: [account_id, title, last_seen_at], properties: { account_id: { type: string }, title: { type: string }, last_seen_at: { type: string, format: date-time }, user_id: { type: string } } }
    FeedItem:
      type: object
      required: [id, user_id, display_name, kind, title, occurred_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        display_name: { type: string }
        kind: { type: string, enum: [watch, rewatch, rating, bulk_watch] }
        title: { type: string }
        media_type: { type: string, enum: [movie, tv] }
        tmdb_id: { type: integer, description: TMDB ID of the movie or show. }
        artwork_path: { type: string, description: Episode still when available, otherwise the media poster path. }
        rating: { type: integer, minimum: 1, maximum: 5 }
        count: { type: integer }
        season_number: { type: integer }
        episode_number: { type: integer }
        episode_name: { type: string }
        occurred_at: { type: string, format: date-time }
    CommunityUser:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    CommunityProfile:
      type: object
      required: [id, name, sharing]
      properties:
        id: { type: string }
        name: { type: string }
        sharing: { type: boolean, description: Whether activity and library are visible to this instance. }
    CommunityUsersPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CommunityUser' } }
        next_cursor: { type: [string, 'null'] }
    CommunityLibraryItem:
      type: object
      required: [media, status, rating]
      properties:
        media: { $ref: '#/components/schemas/MediaSnapshot' }
        status: { type: string, enum: [watching, watchlist, paused, completed, dropped] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        progress: { $ref: '#/components/schemas/ShowLibraryProgress' }
    CommunityLibraryPage:
      type: object
      required: [items, next_cursor, total_count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CommunityLibraryItem' } }
        next_cursor: { type: [string, 'null'] }
        total_count: { type: integer, minimum: 0 }
    UsersPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        next_cursor: { type: [string, 'null'] }
    LibraryPage:
      type: object
      required: [items, next_cursor, total_count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LibraryEntry' } }
        next_cursor: { type: [string, 'null'] }
        total_count: { type: integer, minimum: 0, description: Total number of titles matching the requested status and media type filters. }
    PlaysPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        next_cursor: { type: [string, 'null'] }
    EpisodesPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ShowEpisode' } }
        next_cursor: { type: [string, 'null'] }
    FeedPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FeedItem' } }
        next_cursor: { type: [string, 'null'] }
    ExportData:
      type: object
      required: [exported_at, library, plays, episode_ratings]
      properties:
        exported_at: { type: string, format: date-time }
        library:
          type: array
          items:
            type: object
            required: [media_id, title, type, status, rating]
            properties:
              media_id: { type: string }
              title: { type: string }
              type: { type: string, enum: [movie, tv] }
              status: { type: string, enum: [watchlist, watching, paused, dropped, completed] }
              rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        plays:
          type: array
          items:
            type: object
            required: [id, media_id, episode_id, watched_at]
            properties:
              id: { type: string }
              media_id: { type: [string, 'null'] }
              episode_id: { type: [string, 'null'] }
              watched_at: { type: string, format: date-time }
        episode_ratings:
          type: array
          items:
            type: object
            required: [episode_id, rating, updated_at]
            properties:
              episode_id: { type: string }
              rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
              updated_at: { type: string, format: date-time }
    MediaSearchResult:
      type: object
      required: [tmdb_id, type, title, original_title, overview, release_date, poster_path, original_language]
      properties:
        tmdb_id: { type: integer, format: int64 }
        type: { type: string, enum: [movie, tv] }
        title: { type: string }
        original_title: { type: string }
        overview: { type: string }
        release_date: { type: string, description: Release or first air date when known; otherwise an empty string. }
        poster_path: { type: string }
        original_language: { type: string }
        backdrop_path: { type: string }
    TrendingResponse:
      type: object
      required: [tv, movies]
      properties:
        tv: { type: array, items: { $ref: '#/components/schemas/MediaSearchResult' } }
        movies: { type: array, items: { $ref: '#/components/schemas/MediaSearchResult' } }
    CastMember:
      type: object
      required: [id, name, character]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        character: { type: string }
        profile_path: { type: string }
    CrewMember:
      type: object
      required: [id, name, job, department]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        job: { type: string }
        department: { type: string }
        profile_path: { type: string }
    PersonCredit:
      type: object
      required: [tmdb_id, type, title, popularity]
      properties:
        tmdb_id: { type: integer, format: int64 }
        type: { type: string, enum: [movie, tv] }
        title: { type: string }
        original_title: { type: string }
        character: { type: string }
        overview: { type: string }
        release_date: { type: string }
        poster_path: { type: string }
        backdrop_path: { type: string }
        original_language: { type: string }
        popularity: { type: number, format: float }
    TemporaryMovieDetails:
      type: object
      required: [media, cast, genres]
      properties:
        media: { $ref: '#/components/schemas/MediaSnapshot' }
        runtime: { type: integer, minimum: 0 }
        vote_average: { type: number, minimum: 0, maximum: 10 }
        genres: { type: array, items: { type: string } }
        cast: { type: array, items: { $ref: '#/components/schemas/CastMember' } }
    TemporaryShowDetails:
      type: object
      required: [media, seasons, cast]
      properties:
        media: { $ref: '#/components/schemas/MediaSnapshot' }
        seasons: { type: array, items: { $ref: '#/components/schemas/TemporarySeasonDetails' } }
        cast: { type: array, items: { $ref: '#/components/schemas/CastMember' } }
    TemporarySeasonDetails:
      type: object
      required: [tmdb_id, season_number, name]
      properties:
        tmdb_id: { type: integer, format: int64 }
        season_number: { type: integer, minimum: 0 }
        name: { type: string }
        overview: { type: string }
        poster_path: { type: string }
        air_date: { type: string, format: date }
        episodes: { type: array, items: { $ref: '#/components/schemas/ShowEpisode' } }
    TemporaryEpisodeDetails:
      type: object
      required: [name]
      properties:
        name: { type: string }
        overview: { type: string }
        air_date: { type: string, format: date }
        runtime: { type: integer, minimum: 0 }
        still_path: { type: string }
        vote_average: { type: number, minimum: 0, maximum: 10 }
        production_code: { type: string }
        guest_stars: { type: array, items: { $ref: '#/components/schemas/CastMember' } }
        crew: { type: array, items: { $ref: '#/components/schemas/CrewMember' } }
    SaveLibraryRequest:
      type: object
      required: [media, status]
      properties:
        media: { $ref: '#/components/schemas/MediaSearchResult' }
        status: { type: string, enum: [watchlist, watching, paused, dropped, completed] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        confirm_all_episodes: { type: boolean, description: Required when manually completing a TV show. }
    UpdateLibraryRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [watchlist, watching, paused, dropped, completed] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        confirm_all_episodes: { type: boolean, description: Required when manually completing a TV show. }
    EpisodeRating:
      type: object
      required: [episode_id, rating]
      properties:
        episode_id: { type: string }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        updated_at: { type: string, format: date-time }
    SetEpisodeRatingRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
    LibraryItem:
      type: object
      required: [user_id, media_id, status, notifications_enabled, season_alerts_enabled, added_at, updated_at]
      properties:
        user_id: { type: string }
        media_id: { type: string }
        status: { type: string, enum: ['', watchlist, watching, paused, dropped, completed], description: Empty only in an unsaved movie or show detail response. }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        notifications_enabled: { type: boolean, description: Per-show episode alerts or per-watchlist movie release alerts. }
        season_alerts_enabled: { type: boolean, description: Notify when each season of a tracked show is fully available. }
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_episode_ids: { type: array, items: { type: string }, description: Episodes first marked watched by a confirmed show completion; present only in that response. }
    LibraryEntry:
      type: object
      required: [item, media, metadata_ready]
      properties:
        item: { $ref: '#/components/schemas/LibraryItem' }
        media: { $ref: '#/components/schemas/MediaSnapshot' }
        progress: { $ref: '#/components/schemas/ShowLibraryProgress' }
        metadata_ready: { type: boolean }
        cast: { type: array, items: { $ref: '#/components/schemas/CastMember' } }
        runtime: { type: integer, minimum: 0 }
        genres: { type: array, items: { type: string } }
        vote_average: { type: number, minimum: 0, maximum: 10 }
    ShowLibraryProgress:
      type: object
      description: Per-user TV progress across regular episodes only; omitted for movies and shows without imported episode metadata.
      required: [watched_episodes, total_episodes]
      properties:
        watched_episodes: { type: integer, minimum: 0 }
        total_episodes: { type: integer, minimum: 1 }
    CreatePlayRequest:
      type: object
      properties:
        media_id: { type: string }
        episode_id: { type: string }
        watched_at: { type: string, format: date-time, description: Must not be in the future. Defaults to now. }
        source: { type: string, enum: [web, api, mcp, import, plex], default: web }
      oneOf:
        - required: [media_id]
        - required: [episode_id]
    CorrectPlayRequest:
      type: object
      required: [watched_at]
      properties:
        watched_at: { type: string, format: date-time, description: Must not be in the future. }
    Play:
      type: object
      required: [id, user_id, watched_at, source]
      properties:
        id: { type: string }
        user_id: { type: string }
        media_id: { type: [string, 'null'] }
        episode_id: { type: [string, 'null'] }
        watched_at: { type: string, format: date-time }
        source: { type: string, enum: [web, api, mcp, import, plex] }
    HistoryEntry:
      type: object
      required: [play, title]
      properties:
        play: { $ref: '#/components/schemas/Play' }
        title: { type: string }
        tmdb_id: { type: integer, description: TMDB ID of the movie or show. }
        episode_label: { type: string }
    Episode:
      type: object
      required: [id, show_id, season_number, episode_number, air_date]
      properties:
        id: { type: string }
        show_id: { type: string }
        season_number: { type: integer, minimum: 0 }
        episode_number: { type: integer, minimum: 0 }
        air_date: { type: [string, 'null'], format: date }
    Season:
      type: object
      required: [id, show_id, season_number, name, episode_count]
      properties:
        id: { type: string }
        show_id: { type: string }
        season_number: { type: integer, minimum: 0 }
        name: { type: string }
        episode_count: { type: integer, minimum: 0 }
        air_date: { type: string, format: date }
    SeasonReadyAlert:
      type: object
      required: [ready, subscribed]
      properties:
        ready: { type: boolean, description: All known regular episodes in the listed season count have aired. }
        subscribed: { type: boolean, description: A pending season-ready alert exists for this user. }
    ShowEpisode:
      type: object
      required: [episode, name, watched]
      properties:
        episode: { $ref: '#/components/schemas/Episode' }
        name: { type: string }
        overview: { type: string }
        runtime: { type: integer, minimum: 0 }
        still_path: { type: string }
        watched: { type: boolean }
        last_watched_at: { type: string, format: date-time }
    MediaSnapshot:
      type: object
      required: [id, title, original_title, overview, release_date, poster_path, original_language, type, tmdb_id]
      properties:
        id: { type: string }
        title: { type: string }
        original_title: { type: string }
        overview: { type: string }
        release_date: { type: string }
        poster_path: { type: string }
        backdrop_path: { type: string }
        original_language: { type: string }
        status: { type: string }
        type: { type: string, enum: [movie, tv] }
        tmdb_id: { type: integer, format: int64 }
    ShowProgress:
      type: object
      required: [show_id, cursor, next_episode, latest_released_episode, is_caught_up, is_fully_watched, watched_episodes, total_episodes, released_episodes, missing_prior_episodes]
      properties:
        show_id: { type: string }
        cursor: { anyOf: [{ $ref: '#/components/schemas/Episode' }, { type: 'null' }] }
        next_episode: { anyOf: [{ $ref: '#/components/schemas/Episode' }, { type: 'null' }] }
        latest_released_episode: { anyOf: [{ $ref: '#/components/schemas/Episode' }, { type: 'null' }] }
        is_caught_up: { type: boolean, description: No released episode follows the furthest watched episode; earlier unwatched gaps may remain. }
        is_fully_watched: { type: boolean, description: Every released regular episode is watched. }
        watched_episodes: { type: integer, minimum: 0 }
        total_episodes: { type: integer, minimum: 0 }
        released_episodes: { type: integer, minimum: 0 }
        missing_prior_episodes: { type: integer, minimum: 0, description: Released unwatched regular episodes at or before the furthest watched episode. }
    WatchThroughRequest:
      type: object
      required: [season_number, episode_number]
      properties:
        season_number: { type: integer, minimum: 1 }
        episode_number: { type: integer, minimum: 1 }
        watched_at: { type: string, format: date-time, description: Defaults to the current time. }
    WatchThroughResponse:
      type: object
      required: [marked_count, progress]
      properties:
        marked_count: { type: integer, minimum: 0 }
        progress: { $ref: '#/components/schemas/ShowProgress' }
    ContinueEntry:
      type: object
      required: [show_id, title, kind, remaining_episodes]
      properties:
        show_id: { type: string }
        title: { type: string }
        poster_path: { type: string }
        kind: { type: string, enum: [continue, start] }
        cursor: { anyOf: [{ $ref: '#/components/schemas/Episode' }, { type: 'null' }] }
        next_episode: { $ref: '#/components/schemas/Episode' }
        remaining_episodes: { type: integer, minimum: 0 }
        missing_prior_episodes: { type: array, items: { $ref: '#/components/schemas/Episode' } }
    CalendarEntry:
      type: object
      required: [show_id, title, episode]
      properties:
        show_id: { type: string }
        title: { type: string }
        poster_path: { type: string }
        episode: { $ref: '#/components/schemas/Episode' }
        episode_name: { type: string }
        episode_still_path: { type: string }
    CalendarPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CalendarEntry' } }
        next_cursor: { type: [string, 'null'] }
